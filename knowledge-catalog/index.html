<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>知识目录 · V8 学习工作台</title>
  <link rel="stylesheet" href="./catalog.css">
  <script type="module" src="./catalog-app.mjs"></script>
</head>
<body>
  <a class="skip" href="#catalogResults">跳到知识条目</a>
  <header class="top"><a href="../index.html#/components" class="brand">K <span>学习工作台</span></a><a href="../index.html#/learn">返回原有课程 ↗</a></header>
  <main>
    <section class="intro"><p class="eyebrow">V8 KNOWLEDGE DIRECTORY</p><h1>知识目录</h1><p id="summary">正在读取目录…</p><a class="sample-link" href="#K-D01-001">开始 Button 教学样板 →</a></section>
    <div class="workspace">
      <aside><h2>知识领域</h2><nav id="domains" aria-label="按知识领域筛选"></nav></aside>
      <section class="catalog" aria-label="知识条目">
        <form id="searchForm" class="searchbar" role="search"><label for="catalogSearch">搜索目录</label><div class="search-controls"><input id="catalogSearch" type="search" autocomplete="off" placeholder="名称、知识 ID 或主题"><button type="button" id="clearSearch">清除</button></div></form>
        <p id="resultCount" role="status" aria-live="polite"></p>
        <div id="catalogResults" class="entry-grid" tabindex="-1"></div>
        <button type="button" id="showMore" hidden>加载更多</button>
      </section>
    </div>
    <details class="candidates"><summary>D17 专业基础 · 候选方向</summary><p>保留 13 个候选子领域；尚未分配正式知识 ID。G10 AI 工程归入 D14。</p><ul id="d17List"></ul></details>
    <p class="boundary">目录入口与课程正文分别建设；原有学习记录和实训保持原样。</p>
  </main>
  <dialog id="entryDialog" aria-labelledby="detailTitle">
    <div class="dialog-head"><span id="detailId"></span><button type="button" id="closeDialog" aria-label="关闭知识详情">关闭 ✕</button></div>
    <h2 id="detailTitle"></h2><div id="detailBody"></div>
  </dialog>
</body>
</html>
