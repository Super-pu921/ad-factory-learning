    <p class="catalog-sidebar__label">工作空间</p>

  <main class="catalog-main">
    <section id="catalogDirectory">
    <section class="intro"><p class="eyebrow">V8 KNOWLEDGE DIRECTORY</p><h1>知识目录</h1><p id="summary">正在读取目录…</p><p id="teachingCoverage"></p><p id="skippedCoverage"></p><a class="sample-link" href="#K-D01-001">开始 Button 教学样板 →</a></section>
    <div class="workspace">
      <aside><h2>知识领域</h2><nav id="domains" aria-label="按知识领域筛选"></nav></aside>
      <section class="catalog" aria-label="知识条目">
        <form id="searchForm" class="searchbar" role="search"><label for="catalogSearch">搜索目录</label><div class="search-controls"><input id="catalogSearch" type="search" autocomplete="off" placeholder="名称、知识 ID 或主题"><button type="button" id="clearSearch">清除</button></div></form>
        <label class="teaching-filter"><input id="teachingOnly" type="checkbox">只看已有教学</label>
        <div class="teaching-selects"><div><label for="levelFilter">教学层级</label><select id="levelFilter"><option value="all">全部层级</option><option value="L1">L1 基础知识</option><option value="L2">L2 工程实现</option><option value="L3">L3 系统应用</option></select></div><div><label for="difficultyFilter">教学难度</label><select id="difficultyFilter"><option value="all">全部难度</option><option value="E1">E1</option><option value="E2">E2</option><option value="E3">E3</option><option value="E4">E4</option><option value="E5">E5</option></select></div></div>
        <div class="filter-actions"><a id="filterLink" class="inline-link" href="./">当前筛选链接</a><button id="resetFilters" type="button">重置筛选</button></div>
        <p id="resultCount" role="status" aria-live="polite"></p>
        <div id="catalogResults" class="entry-grid" tabindex="-1"></div>
        <button type="button" id="showMore" hidden>加载更多</button>
      </section>
    </div>
    <details class="candidates"><summary>D17 专业基础 · 候选方向</summary><p>保留 13 个候选子领域；尚未分配正式知识 ID。G10 AI 工程归入 D14。</p><ul id="d17List"></ul></details>
    <p class="boundary">目录入口与课程正文分别建设；原有学习记录和实训保持原样。</p>
    </section>
    <div class="catalog-detail-wrap"><dialog id="entryDialog" role="region" aria-labelledby="detailTitle">
      <div class="dialog-head"><button type="button" id="closeDialog" aria-label="关闭知识详情">← 知识目录</button><span id="detailId"></span></div>
      <h1 id="detailTitle" class="catalog-detail-title"></h1><div id="detailBody"></div>
    </dialog></div>
